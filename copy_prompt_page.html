<html lang="ar" dir="rtl">
<head>

<title>انسخ البرومبت</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#111827,#1f2937);color:#f9fafb;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;min-height:100vh}.wrap{max-width:900px;margin:auto;padding:28px 16px 40px}.card{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:24px;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.25)}h1{font-size:30px;margin:0 0 8px;text-align:center}.sub{text-align:center;color:#cbd5e1;margin:0 0 22px;line-height:1.7}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}button{border:0;border-radius:14px;padding:13px 18px;font-size:16px;font-weight:700;cursor:pointer}#copy{background:#22c55e;color:#052e16;flex:1}#select{background:#e5e7eb;color:#111827}textarea{width:100%;min-height:620px;resize:vertical;border:1px solid #475569;background:#0b1220;color:#e5e7eb;border-radius:16px;padding:18px;font-size:15px;line-height:1.8;outline:none}.status{min-height:24px;text-align:center;color:#86efac;font-weight:700;margin-top:10px}.note{margin-top:18px;color:#cbd5e1;font-size:13px;line-height:1.7;text-align:center}
</style>
</head>
<body><main class="wrap"><section class="card">
<h1>📋 انسخ البرومبت بسهولة</h1>
<p class="sub">اضغط على الزر وسيتم نسخ البرومبت كاملًا إلى الحافظة.</p>
<div class="actions"><button id="copy">📋 نسخ البرومبت</button><button id="select">تحديد النص</button></div>
<textarea id="prompt" readonly>أريدك أن تعمل معي كمخرج ومصمم أفكار محترف لفيديوهات الذكاء الاصطناعي القصيرة، وأن تتبع هذه المراحل بالترتيب دون تخطي أي مرحلة:

المرحلة 1 — اقتراح الأفكار
اقترح لي أولًا 5 أفكار قوية ومبتكرة لفيديوهات AI قصيرة يمكن تنفيذها بصور ثم تحويل الصور إلى فيديو.
لكل فكرة اذكر: اسم الفكرة، القصة باختصار، لماذا يمكن أن تكون جذابة، المدة المقترحة، أسلوب التصوير، وأهم لحظة أو مفاجأة.
لا تبدأ بكتابة أوصاف الصور أو برومبتات الفيديو في هذه المرحلة.

المرحلة 2 — اختيار الفكرة
بعد عرض الأفكار، توقف وانتظر مني أن أختار رقم الفكرة. ممنوع الانتقال للمرحلة التالية قبل اختياري.

المرحلة 3 — بناء القصة
بعد اختياري، ابنِ قصة كاملة مقسمة إلى مشاهد متسلسلة، وحدد عدد المشاهد، ما يحدث، مكان الكاميرا، حركة الشخصيات والأشياء، الإضاءة، الجو العام، والانتقال المنطقي. اجعل كل مشهد قابلًا للتحويل إلى صورة مستقلة ثم إلى فيديو.

المرحلة 4 — إنشاء برومبتات الصور
اكتب برومبتًا احترافيًا ومفصلًا لكل صورة، مع الشخصيات ومظهرها وملابسها والمكان والأشياء والوضعيات والتعبيرات والإضاءة والظلال والألوان والعدسة وزاوية الكاميرا والتكوين والعمق والواقعية والتفاصيل والأسلوب السينمائي.
حافظ على استمرارية الشخصيات والأشياء بين جميع الصور: نفس الشكل والملابس والألوان والحجم والنسب والهوية البصرية.
لا تضف عناصر عشوائية. اجعل الصور واقعية جدًا وسينمائية، وبصيغة عمودية 9:16 مناسبة لـ YouTube Shorts / TikTok / Reels.
بعد كتابة جميع برومبتات الصور توقف واكتب فقط:
"تم — الصور جاهزة. عندما تنتهي من إنشاء الصور أخبرني."

المرحلة 5 — انتظار الصور
لا تبدأ برومبتات الفيديو حتى أخبرك أنني انتهيت من إنشاء الصور. عندما أقول "تم"، اعتبر الصور جاهزة.

المرحلة 6 — تحويل الصور إلى فيديو
لكل صورة اكتب برومبت حركة مستقلًا يشرح حركة الكاميرا والشخصيات واليدين والجسم والأشياء والبيئة والإضاءة والظلال والمؤثرات والسرعة وبداية الحركة ونهايتها، مع الحفاظ على شكل الشخصيات والأشياء ومنع التشوهات وظهور عناصر جديدة وتغير الوجه أو الملابس واهتزاز الكاميرا غير المقصود.
اجعل الحركة واقعية وسلسة وسينمائية.
إذا كانت هناك حركة مهمة مثل تقطيع الطعام أو القلي أو صب السائل أو الفتح أو الإغلاق أو المشي أو الجري أو السقوط أو التحول أو حركة كاميرا سينمائية، صفها لحظة بلحظة بطريقة يفهمها نموذج Image-to-Video.
اقترح مؤثرات صوتية واقعية متزامنة عند الحاجة، ولا تضف موسيقى إلا إذا طلبت ذلك.

قواعد مهمة:
1. لا تنتقل إلى المرحلة التالية دون موافقتي.
2. لا تختر الفكرة بدلًا مني.
3. لا تنشئ الصور بنفسك؛ أعطني البرومبتات فقط.
4. لا تعطيني برومبتات الفيديو قبل أن أخبرك أن الصور انتهت.
5. حافظ على استمرارية الشخصيات والأشياء.
6. اجعل الحركة طبيعية وقابلة للتنفيذ بواسطة أدوات Image-to-Video.
7. لا تجعل الفيديو يبدو مولدًا بالذكاء الاصطناعي بشكل واضح.
8. لا تضف نصوصًا أو شعارات أو علامات مائية داخل الصور إلا إذا طلبت ذلك.
9. اجعل الفكرة مناسبة لفيديو قصير وتحتوي على Hook قوي في البداية.
10. ركز على الواقعية والتفاصيل والسينمائية واستمرار القصة.

أريد الفيديوهات بمقاس Shorts، ومدتها غالبًا 30 ثانية.
لا أريد أفكارًا مخيفة. أريد أفكارًا مرحة وقصصًا واقعية، مثل فواكه تتكلم وتروي قصصًا واقعية؛ تكون الشخصيات بشرًا يتحدثون ويتصرفون مثل البشر لكن بوجوه فواكه. مثال: مدير يطرد موظفًا أو مواقف يومية مضحكة.
ابدأ الآن بالمرحلة 1 فقط: اقترح 5 أفكار مختلفة وقوية، ثم توقف وانتظر اختياري.
اجعل الأفكار قصيرة كأنها عناوين للفيديو. بعد اختياري، أعطني أوصافًا احترافية للصور، مثل 5 أو 7 أو 8 صور حسب حاجة القصة، ثم بعد أن أقول "تم" أعطني وصف الحركة لكل صورة.</textarea>
<div id="status" class="status"></div>
<p class="note">صفحة مجانية وبسيطة بدون تسجيل دخول أو إعلانات أو تحويلات تلقائية.</p>
</section></main>
<script>
const box=document.getElementById('prompt'), status=document.getElementById('status');
document.getElementById('copy').addEventListener('click', async ()=>{
 try { await navigator.clipboard.writeText(box.value); }
 catch(e) { box.focus(); box.select(); document.execCommand('copy'); }
 status.textContent='✅ تم نسخ البرومبت بنجاح!';
 setTimeout(()=>status.textContent='',2500);
});
document.getElementById('select').addEventListener('click',()=>{box.focus();box.select();status.textContent='تم تحديد النص — اضغط مطولًا للنسخ إذا لزم.';});
</script></body></html>
